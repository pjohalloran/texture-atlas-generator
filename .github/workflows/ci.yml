name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Lets tests that render text (ImageFontGenerator) actually run
      # instead of skipping when no system font is available.
      - name: Install a TrueType font for font-rendering tests
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with flake8
        run: flake8 src tests

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing
